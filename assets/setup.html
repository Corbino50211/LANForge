<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to LANForge</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1118;color:#edf2f9;font:15px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(680px,94vw);padding:42px} .mark{background:#a2f2c7;color:#132b21;border-radius:14px;display:inline-grid;place-items:center;width:48px;height:48px;font-size:26px;font-weight:800}h1{font-size:34px;letter-spacing:-1px;margin:25px 0 8px}p{color:#9caabd}button,input{font:inherit}button{cursor:pointer}.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0}.role{border:1px solid #354154;background:#151d29;color:inherit;padding:20px;border-radius:14px;text-align:left}.role.active{border-color:#a2f2c7;background:#172b28}.role strong{display:block;font-size:17px}.role span{color:#9caabd;font-size:13px}label{display:block;margin:16px 0 6px;font-size:13px;color:#b7c3d3}input{width:100%;padding:12px 14px;background:#141c28;border:1px solid #354154;border-radius:9px;color:white}input:focus{outline:2px solid #a2f2c7}.submit{margin-top:25px;background:#a2f2c7;color:#132b21;border:0;border-radius:9px;padding:13px 20px;font-weight:700;width:100%}.submit:disabled{opacity:.5}small{color:#9caabd}#error{color:#ffb6a9;white-space:pre-wrap}a{color:#a2f2c7}.foot{margin-top:30px;font-size:12px;color:#73859e}@media(max-width:520px){main{padding:22px}.roles{grid-template-columns:1fr}}</style>
<main><div class="mark">L</div><h1>Your servers. Your machines.</h1><p>Welcome to LANForge. Choose what this computer should do.</p><div class="roles"><button class="role active" id="controller"><strong>Manage my servers</strong><span>Main PC · dashboard + hosting</span></button><button class="role" id="host"><strong>Join my controller</strong><span>Laptop or another host computer</span></button></div><form id="form"><label for="name">Computer name</label><input id="name" placeholder="e.g. Main PC or Living room laptop" maxlength="80" required><div id="controllerFields"><label for="password">Create your dashboard password</label><input id="password" type="password" minlength="10" maxlength="72" autocomplete="new-password"><label for="port">Management port</label><input id="port" type="number" value="8443" min="1024" max="65535"><small>One local-network port for the dashboard and all computers.</small></div><div id="hostFields" hidden><label for="address">Controller address</label><input id="address" placeholder="https://192.168.1.10:8443"><label for="code">Pairing code</label><input id="code" placeholder="From Computers → Add computer"><label for="fingerprint">Controller fingerprint</label><input id="fingerprint" placeholder="Paste the fingerprint shown beside the pairing code"><small>The fingerprint verifies you are connecting to your own controller.</small></div><p id="error" role="alert"></p><button id="submit" class="submit">Set up this computer →</button></form><p class="foot">Local-first · Windows & Linux · No LANForge cloud account</p></main><script>
let role='controller';const $=id=>document.getElementById(id);for(const r of ['controller','host'])$(r).onclick=()=>{role=r;$('controller').classList.toggle('active',r==='controller');$('host').classList.toggle('active',r==='host');$('controllerFields').hidden=r!=='controller';$('hostFields').hidden=r!=='host'};const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('submit').disabled=true;try{const res=await fetch('/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':token},body:JSON.stringify({role,name:$('name').value,password:$('password').value,port:Number($('port').value),controller:$('address').value,fingerprint:$('fingerprint').value,code:$('code').value})});const data=await res.json();if(!res.ok)throw Error(data.error);$('form').replaceChildren();const p=document.createElement('p');p.textContent=role==='controller'?'Your controller is ready. On the first visit, your browser will ask you to accept its local HTTPS certificate.':'This computer is paired and will connect automatically. Keep LANForge running to manage servers here.';const a=document.createElement('a');a.href=data.url;a.textContent='Open your dashboard →';$('form').append(p,a);if(role==='controller')setTimeout(()=>location.href=data.url,2500)}catch(e){$('error').textContent=e.message;$('submit').disabled=false}};
</script></html>
